name: Deploy to GitHub Pages

# main への push と毎日の定時に、CelesTrak から軌道要素を取り直し、確かめて公開する。
# Pull Request（Dependabot の更新など）では確かめるだけで公開しない
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 毎日 06:00 UTC（日本時間 15:00）。その日の夕方と翌朝の通過を、半日以内の軌道要素で出すため。
  # GitHub は 60 日間 push の無いリポジトリの定時実行を止めるので、止まったら Actions の画面から有効に戻す
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# 公開は1つずつ順に。Pull Request は Pull Request ごとに、新しい push が来たら古い実行をやめる
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # ubuntu-latest は予告なく新しい版に切り替わり、Chrome の場所などが変わりうるので、版を固定する
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # SGP4 の検証用データ（Vallado の付録 zip）は変わらないので、取り直さずに使い回す
      - uses: actions/cache@v6
        with:
          path: raw/vallado.zip
          key: vallado-aiaa-2006-6753
      - run: npm run fetch
      - run: npm run convert
      - run: npm run check
      # 公開と同じ設定でビルドしたものを、ヘッドレスの Chrome で操作して確かめる
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e-failures
          if-no-files-found: ignore
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    # 公開に要る権限は、公開の手順にだけ持たせる
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
